<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbox Auto-Book</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 20px; max-width: 600px; margin: 0 auto; }
  h1 { font-size: 1.4em; margin-bottom: 16px; }
  #log { background: #1a1a1a; border-radius: 8px; padding: 16px; font-family: monospace; font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; min-height: 200px; }
  .info { color: #8bc34a; }
  .warn { color: #ffc107; }
  .error { color: #f44336; }
  .step { color: #64b5f6; }
</style>
</head>
<body>
<h1>Arbox Auto-Book</h1>
<div id="log">Starting...\n</div>

<script src="book_class.js"></script>
</body>
</html>
